<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Statistik - Syariah App</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/png" href="../../logo-syariah-app.png" />
  <link rel="stylesheet" href="../../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <a href="/" class="nav-brand page-brand">
          <img src="../../logo-syariah-app.png" alt="Syariah App Logo" class="nav-logo" />
          <span class="nav-title">Syariah <span class="accent">App</span></span>
        </a>
        <h1>Admin Statistik</h1>
        <p>Ringkasan pengunjung dan download resmi Syariah App.</p>
      </div>
      <button class="modal-close" id="refreshStats">Refresh</button>
    </header>

    <section class="admin-grid">
      <article class="metric-card">
        <span>Pengunjung Hari Ini</span>
        <strong id="visitorsToday">0</strong>
      </article>
      <article class="metric-card">
        <span>7 Hari Terakhir</span>
        <strong id="visitorsWeek">0</strong>
      </article>
      <article class="metric-card">
        <span>30 Hari Terakhir</span>
        <strong id="visitorsMonth">0</strong>
      </article>
      <article class="metric-card">
        <span>Total Download</span>
        <strong id="downloadsTotal">0</strong>
      </article>
      <article class="metric-card">
        <span>Download Hari Ini</span>
        <strong id="downloadsToday">0</strong>
      </article>
      <article class="metric-card">
        <span>Download Bulan Ini</span>
        <strong id="downloadsMonth">0</strong>
      </article>
    </section>

    <section class="chart-grid">
      <article class="chart-card">
        <h2>Visitor Trend</h2>
        <canvas id="visitorChart" height="130"></canvas>
      </article>
      <article class="chart-card">
        <h2>Download Trend</h2>
        <canvas id="downloadChart" height="130"></canvas>
      </article>
    </section>

    <section class="chart-card">
      <h2>Download per Versi</h2>
      <div class="version-table" id="versionTable">Belum ada data download.</div>
    </section>

    <p class="admin-status" id="adminStatus">Memuat data...</p>
  </main>

  <script>
    let visitorChart;
    let downloadChart;

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = Number(value || 0).toLocaleString('id-ID');
    }

    function renderVersionTable(items) {
      const table = document.getElementById('versionTable');
      if (!items || !items.length) {
        table.textContent = 'Belum ada data download.';
        return;
      }
      table.innerHTML = items.map(item => `
        <div class="version-row">
          <span>${item.version}</span>
          <strong>${Number(item.total || 0).toLocaleString('id-ID')}</strong>
        </div>
      `).join('');
    }

    function renderLineChart(canvasId, existingChart, label, data, color) {
      const ctx = document.getElementById(canvasId);
      if (!ctx || !window.Chart) return existingChart;
      const labels = data.map(item => item.date.slice(5));
      const values = data.map(item => item.value);

      if (existingChart) existingChart.destroy();
      return new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label,
            data: values,
            borderColor: color,
            backgroundColor: color.replace('1)', '0.16)'),
            tension: 0.35,
            fill: true,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#8BAAA4' } } },
          scales: {
            x: { ticks: { color: '#8BAAA4' }, grid: { color: 'rgba(255,255,255,0.05)' } },
            y: { beginAtZero: true, ticks: { color: '#8BAAA4', precision: 0 }, grid: { color: 'rgba(255,255,255,0.05)' } },
          },
        },
      });
    }

    async function loadStats() {
      const status = document.getElementById('adminStatus');
      try {
        const response = await fetch('/api/stats', { cache: 'no-store' });
        const data = await response.json();
        if (!data.ok) throw new Error('Stats response failed');

        const stats = data.stats;
        setText('visitorsToday', stats.visitors.today);
        setText('visitorsWeek', stats.visitors.week);
        setText('visitorsMonth', stats.visitors.month);
        setText('downloadsTotal', stats.downloadStats.total);
        setText('downloadsToday', stats.downloadStats.today);
        setText('downloadsMonth', stats.downloadStats.month);

        const trend = stats.trend || [];
        visitorChart = renderLineChart('visitorChart', visitorChart, 'Pengunjung', trend.map(item => ({ date: item.date, value: item.visitors })), 'rgba(0,150,136,1)');
        downloadChart = renderLineChart('downloadChart', downloadChart, 'Download', trend.map(item => ({ date: item.date, value: item.downloads })), 'rgba(245,158,11,1)');
        renderVersionTable(stats.downloadStats.byVersion);

        status.textContent = stats.configured
          ? `Data terakhir diperbarui: ${new Date(stats.generatedAt).toLocaleString('id-ID')}`
          : 'Supabase belum dikonfigurasi. Set SUPABASE_URL dan SUPABASE_SERVICE_ROLE_KEY di Vercel Environment Variables.';
      } catch (error) {
        status.textContent = 'Gagal memuat statistik. Periksa Vercel Function logs dan konfigurasi environment.';
      }
    }

    document.getElementById('refreshStats')?.addEventListener('click', loadStats);
    window.addEventListener('load', loadStats);
  </script>
</body>
</html>
